name: trit verify
description: Verify three-valued decision tables with trit
inputs:
  policy:
    description: Policy JSON path, relative to the caller workspace
    required: false
    default: policy.json
  engine:
    description: sat (default) or bdd
    required: false
    default: sat
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
    - shell: bash
      working-directory: ${{ github.workspace }}
      env:
        POLICY_PATH: ${{ inputs.policy }}
        TRIT_ENGINE: ${{ inputs.engine }}
      run: |
        case "$TRIT_ENGINE" in
          sat|bdd) ;;
          *) echo "engine must be sat or bdd, got: $TRIT_ENGINE" >&2; exit 2 ;;
        esac
        cargo run --release --quiet --locked \
          --manifest-path "${GITHUB_ACTION_PATH}/../Cargo.toml" \
          -p trit-cli -- verify "$POLICY_PATH" --engine "$TRIT_ENGINE"
